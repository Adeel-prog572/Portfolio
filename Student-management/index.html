<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>
        <p class="subtitle">Manage your students easily</p>

        <div class="form">

            <input
                type="text"
                id="name"
                placeholder="Student Name"
            >

            <input
                type="text"
                id="rollNo"
                placeholder="Roll Number"
            >

            <input
                type="text"
                id="className"
                placeholder="Class"
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
            >

            <button id="addBtn">Add Student</button>

        </div>

        <p id="error"></p>

        <div class="top-bar">

            <h2>Students</h2>

            <span id="studentCount">
                Total Students: 0
            </span>

        </div>

        <input
            type="text"
            id="search"
            placeholder="Search student..."
            class="search"
        >

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Name</th>
                        <th>Roll No</th>
                        <th>Class</th>
                        <th>Email</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="studentList"></tbody>

            </table>

        </div>

        <p id="emptyMessage">
            No students added yet.
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
